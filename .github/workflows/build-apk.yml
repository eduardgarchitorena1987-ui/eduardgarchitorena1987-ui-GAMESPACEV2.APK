name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME is $JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Unable to detect Java version."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Java version verification passed ($JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Reusing existing debug keystore."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: debug.keystore could not be verified or created."
            exit 1
          fi
          echo "debug.keystore verified successfully."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected APK not found at $TARGET_APK"
            echo "Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 4 -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: Generated APK at $TARGET_APK is empty."
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "ERROR: Target file does not have .apk extension"; exit 1 ;;
          esac
          echo "APK verified successfully: $TARGET_APK ($(stat -c%s "$TARGET_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GAMESPACEV2-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/GAMESPACEV2.apk
          if-no-files-found: warn

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d -t apk-release-XXXXXX)
          SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="$TMP_DIR/app-debug.apk"
          GAMESPACE_APK="$TMP_DIR/GAMESPACEV2.apk"
          cp "$SRC_APK" "$DEST_APK"
          cp "$SRC_APK" "$GAMESPACE_APK"
          if [ ! -f "$GAMESPACE_APK" ] || [ ! -s "$GAMESPACE_APK" ]; then
            echo "ERROR: Failed to prepare APK release asset at $GAMESPACE_APK"
            exit 1
          fi
          echo "Prepared release assets: $DEST_APK and $GAMESPACE_APK"
          echo "apk_path=$DEST_APK" >> "$GITHUB_OUTPUT"
          echo "gamespace_path=$GAMESPACE_APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="GAMESPACEV2 Debug APK Build #${{ github.run_number }}"
          APK_FILE="${{ steps.prepare_asset.outputs.apk_path }}"
          GAMESPACE_FILE="${{ steps.prepare_asset.outputs.gamespace_path }}"

          echo "Creating GitHub Release with tag: $RELEASE_TAG and title: $RELEASE_TITLE"

          RELEASE_NOTES=$(cat <<EOF
          ### 📱 Automated GAMESPACEV2 APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run:** #${{ github.run_number }}
          - **Workflow Attempt:** #${{ github.run_attempt }}
          - **Source Commit:** \`${{ github.sha }}\`
          - **Release Tag:** \`${RELEASE_TAG}\`
          - **Download File:** \`GAMESPACEV2.apk\`

          > **Note:** This APK is signed with the debug keystore and ready for direct Android installation.
          EOF
          )

          gh release create "$RELEASE_TAG" "$GAMESPACE_FILE" "$APK_FILE" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/GAMESPACEV2.apk"
          ALT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=================================================="
            echo "GitHub Release published successfully!"
            gh release view "$RELEASE_TAG" || true
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: GAMESPACEV2 Debug APK Build #${{ github.run_number }}"
            echo "Direct Download URL: $DIRECT_URL"
            echo "=================================================="

            {
              echo "## 📱 DIRECT APK DOWNLOAD: GAMESPACEV2.apk"
              echo ""
              echo "Download the compiled GAMESPACEV2 APK directly:"
              echo ""
              echo "👉 **[$DIRECT_URL]($DIRECT_URL)**"
              echo ""
              echo "Alternative link: [$ALT_URL]($ALT_URL)"
              echo ""
              echo "> **Backup Artifact:** The standard GitHub Actions artifact \`GAMESPACEV2-apk\` remains available on this workflow run page."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "=================================================="
            echo "WARNING: GitHub Release publishing failed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK was built successfully and is preserved as an Actions artifact."
              echo "Artifact Name: app-debug-apk"
            fi
            echo "=================================================="

            {
              echo "## ⚠️ GitHub Release Warning"
              echo ""
              echo "Automatic release creation encountered an issue, but your build completed."
              echo "You can download the \`app-debug-apk\` artifact directly from the Summary page of this Actions run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
